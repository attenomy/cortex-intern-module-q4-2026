name: Attenomy Cortex CI Pipeline

on:
  push:
    branches: [ staging ]
  pull_request:
    branches: [ staging ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Backend Test Suite & Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest pytest-cov httpx ruff "pip-audit>=2.7"

      - name: Lint Code with Ruff
        run: |
          ruff check api/

      - name: Run Pytest Test Suite with Coverage
        env:
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          pytest -v --cov=api --cov-report=term --cov-report=xml:coverage.xml --cov-report=html:coverage_html

      - name: Upload Coverage Report Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage_html/
          retention-days: 14

      - name: Security Audit with pip-audit
        run: |
          for i in 1 2 3; do
            echo "Running pip-audit attempt $i..."
            pip-audit && break || {
              if [ "$i" -eq 3 ]; then
                echo "pip-audit detected vulnerabilities or sustained fatal network failures."
                exit 1
              fi
              echo "pip-audit transient network failure encountered. Retrying in 10s..."
              sleep 10
            }
          done
