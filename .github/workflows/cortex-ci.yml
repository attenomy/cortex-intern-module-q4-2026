name: Attenomy Cortex CI Pipeline

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

permissions:
  contents: read

concurrency:
  group: cortex-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install ruff==0.17.4

      - name: Lint Code with Ruff
        run: ruff check api/

  test:
    name: Pytest and Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            api/requirements.txt
            api/modules/semantic_cache/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r api/requirements.txt
          pip install --upgrade fsspec
          pip install pytest pytest-cov httpx pip-audit==2.10.1

      - name: Security Scan with pip-audit
        run: pip-audit

      - name: Run Pytest Test Suite
        run: pytest --cov=api/modules --cov-report=term-missing -rs
